<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính điểm sinh viên</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>TÍNH ĐIỂM VÀ XẾP LOẠI SINH VIÊN</h1>

        <form id="studentForm">

            <!-- Tên sinh viên -->
            <div class="form-group">
                <label for="studentName">Tên sinh viên:</label>
                <input
                    type="text"
                    id="studentName"
                    placeholder="Nhập tên sinh viên"
                >
            </div>

            <h2>Nhập điểm 5 môn học</h2>

            <!-- Giải tích 1 -->
            <div class="form-group">
                <label for="calculus">Giải tích 1:</label>
                <input
                    type="number"
                    id="calculus"
                    min="0"
                    max="10"
                    step="0.01"
                    placeholder="0 - 10"
                >
            </div>

            <!-- Đại số tuyến tính -->
            <div class="form-group">
                <label for="linearAlgebra">Đại số tuyến tính:</label>
                <input
                    type="number"
                    id="linearAlgebra"
                    min="0"
                    max="10"
                    step="0.01"
                    placeholder="0 - 10"
                >
            </div>

            <!-- Xác suất thống kê -->
            <div class="form-group">
                <label for="statistics">Xác suất thống kê:</label>
                <input
                    type="number"
                    id="statistics"
                    min="0"
                    max="10"
                    step="0.01"
                    placeholder="0 - 10"
                >
            </div>

            <!-- Tin học đại cương -->
            <div class="form-group">
                <label for="computerScience">Tin học đại cương:</label>
                <input
                    type="number"
                    id="computerScience"
                    min="0"
                    max="10"
                    step="0.01"
                    placeholder="0 - 10"
                >
            </div>

            <!-- Xây dựng ứng dụng Web -->
            <div class="form-group">
                <label for="webDevelopment">Xây dựng ứng dụng Web:</label>
                <input
                    type="number"
                    id="webDevelopment"
                    min="0"
                    max="10"
                    step="0.01"
                    placeholder="0 - 10"
                >
            </div>

            <button type="submit">Tính kết quả</button>

            <p id="errorMessage"></p>

        </form>

        <!-- Kết quả -->
        <div id="result" class="result hidden">

            <h2>KẾT QUẢ HỌC TẬP</h2>

            <p>
                <strong>Tên sinh viên:</strong>
                <span id="resultName"></span>
            </p>

            <table>
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Môn học</th>
                        <th>Điểm</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Giải tích 1</td>
                        <td id="resultCalculus"></td>
                    </tr>

                    <tr>
                        <td>2</td>
                        <td>Đại số tuyến tính</td>
                        <td id="resultLinearAlgebra"></td>
                    </tr>

                    <tr>
                        <td>3</td>
                        <td>Xác suất thống kê</td>
                        <td id="resultStatistics"></td>
                    </tr>

                    <tr>
                        <td>4</td>
                        <td>Tin học đại cương</td>
                        <td id="resultComputerScience"></td>
                    </tr>

                    <tr>
                        <td>5</td>
                        <td>Xây dựng ứng dụng Web</td>
                        <td id="resultWebDevelopment"></td>
                    </tr>
                </tbody>
            </table>

            <div class="summary">
                <p>
                    <strong>Điểm trung bình:</strong>
                    <span id="average"></span>
                </p>

                <p>
                    <strong>Xếp loại:</strong>
                    <span id="classification"></span>
                </p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
